# php-poc/docker-compose.yml
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: php_poc_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: area_db
      MYSQL_USER: area_user
      MYSQL_PASSWORD: password123
    ports:
      - "3307:3306"  # Port différent pour éviter conflits avec PostgreSQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: php_poc_redis
    ports:
      - "6380:6379"  # Port différent du Redis Node.js
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
